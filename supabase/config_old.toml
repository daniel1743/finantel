# Supabase Configuration File
# This file is automatically generated by `supabase init`
# For more information, see: https://supabase.com/docs/guides/cli

[project]
# Your Supabase project reference ID
# Get this from: https://supabase.com/dashboard/project/_/settings/general
# project_id = "your-project-ref"

[auth]
# Enable email confirmations
enable_signup = true
enable_email_confirmations = false

[auth.email]
# Email template settings
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[api]
# API settings
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Database settings
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
port = 54323
ip_version = "ipv4"

[studio]
enabled = true
port = 54324
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54325
smtp_port = 54326
pop3_port = 54327

[storage]
enabled = true
file_size_limit = "50MiB"

[auth.external.apple]
enabled = false

[auth.external.azure]
enabled = false

[auth.external.bitbucket]
enabled = false

[auth.external.discord]
enabled = false

[auth.external.facebook]
enabled = false

[auth.external.github]
enabled = false

